name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    # a release tag rebuilds the page; path filters are not evaluated for tags
    tags: ['[0-9]+.[0-9]+.[0-9]+']
    paths:
      - 'README.md'
      - 'site/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # the build reads the latest release tag

      - name: Install pandoc
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Build HTML from README
        run: |
          version=$(git describe --tags --abbrev=0 --match '[0-9]*.[0-9]*.[0-9]*')
          released=$(git for-each-ref --format='%(creatordate:short)' "refs/tags/$version")
          mkdir -p site/output
          pandoc README.md \
            --standalone \
            --template=site/template.html \
            --metadata title="BEMYAGENT.md" \
            --metadata version="$version" \
            --metadata released="$released" \
            -o site/output/index.html
          echo "bemyagent.md" > site/output/CNAME

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/output

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment
